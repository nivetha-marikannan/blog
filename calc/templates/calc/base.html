{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog Website</title>
        
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
        <!-- Google Fonts -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        
        <!-- Custom CSS -->
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
        
        <style>
            /* General Styles */
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #6a11cb, #2575fc);
                color: #fff;
                margin: 0;
                padding: 0;
            }

            /* Header Styling */
            .page-header {
                padding: 15px 0;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            }

            .page-header .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .page-header h1 a {
                text-decoration: none;
                font-family: 'Lobster', cursive;
                color: #fff;
                font-size: 32px;
                font-style: italic;
                font-weight: bold;
            }

            /* Navigation Bar */
            .nav {
                list-style: none;
                display: flex;
                gap: 15px;
                margin: 0;
                padding: 0;
            }

            .nav li {
                display: inline;
            }

            .nav a {
                text-decoration: none;
                color: #fff;
                font-weight: bold;
                transition: 0.3s;
                padding: 8px 12px;
                border-radius: 5px;
            }

            .nav a:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            /* Logout Button Style (Near Add Post Button) */
            .logout-btn {
                background: red;
                color: white;
                border: none;
                padding: 8px 15px;
                font-size: 14px;
                border-radius: 5px;
                cursor: pointer;
                transition: 0.3s;
                margin-left: 10px;  /* Space between Add Post and Logout */
            }

            .logout-btn:hover {
                background: darkred;
            }

            /* Add Blogs Text Style */
            .blogs-text {
                font-weight: bold;
                font-style: italic;
                font-size: 50px;
                color: rgb(22, 21, 21);
            }

            /* Main Content */
            .container {
                margin-top: 30px;
                padding: 10px;
                background: white;
                color: black;
                border-radius: 15px;
            }

            .posts-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 30px;
            }

            .post-container {
                background: #f0f0f0;
                border-radius: 10px;
                padding: 20px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s ease;
            }

            .post-container:hover {
                transform: scale(1.05);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            }

            .post-title {
                font-size: 1.5rem;
                font-weight: bold;
                color: #333;
                text-decoration: none;
                transition: color 0.3s ease;
            }

            .post-title:hover {
                color: #007bff;
            }

            .post-date {
                font-size: 0.9rem;
                color: #666;
            }

            /* Add Post Button */
            .add-post-btn {
                display: flex;
                justify-content: flex-end;
                margin-bottom: 20px;
            }
        </style>
    </head>

    <body>
        <header class="page-header">
            <div class="container">
                <!-- Added Blogs Text Here -->
                <div class="blogs-text">Blogs</div>
                <nav>
                    <ul class="nav">
                        {% if user.is_authenticated %}
                            <li><a href="{% url 'calc:new-post' %}">Create Post</a></li>
                            <li>
                                <form method="POST" action="{% url 'calc:logout' %}">
                                    {% csrf_token %}
                                    <button type="submit" class="logout-btn">Logout</button>
                                </form>
                            </li>
                        {% else %}
                            <li><a href="{% url 'calc:login' %}">Login</a></li>
                            <li><a href="{% url 'calc:signup' %}">Sign Up</a></li>
                        {% endif %}
                    </ul>
                </nav>
            </div>
        </header>

        <main class="container">
            <div class="row">
                <div class="col">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>
